name: Build HA DeskLink v2

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          dotnet publish src/HaDeskLink -c Release -r win-x64 --self-contained -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HA-DeskLink-Publish
          path: publish/

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download publish
        uses: actions/download-artifact@v4
        with:
          name: HA-DeskLink-Publish
          path: publish/

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Read version
        id: version
        shell: bash
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Inject version into installer.iss
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/#define AppVersion \"0.0.0\"/#define AppVersion \"$VERSION\"/" installer.iss
          echo "Injected version $VERSION into installer.iss"
          grep AppVersion installer.iss

      - name: Build Installer
        run: |
          iscc installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HA-DeskLink-Installer
          path: output/HA_DeskLink_Setup_*.exe

  release:
    needs: installer
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: HA-DeskLink-Installer
          path: dist/

      - name: Download portable publish
        uses: actions/download-artifact@v4
        with:
          name: HA-DeskLink-Publish
          path: portable/

      - name: Create portable zip
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          (cd portable && zip -qr "../HA_DeskLink_Portable_${VERSION}.zip" .)
          ls -lh "HA_DeskLink_Portable_${VERSION}.zip"

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          {
            echo "# HA DeskLink Windows v${VERSION}"
            echo ""
            awk -v ver="## v${VERSION} " 'index($0, ver)==1 {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md
            echo ""
            echo "## Installation"
            echo ""
            echo "Setup: \`HA_DeskLink_Setup_${VERSION}.exe\` herunterladen und ausfuehren. Installiert nach \`C:\\Program Files\\HA DeskLink\\\`."
            echo ""
            echo "Portable: \`HA_DeskLink_Portable_${VERSION}.zip\` entpacken und \`HA_DeskLink.exe\` starten - keine Installation noetig."
            echo ""
            echo "**Wichtig:** Als Administrator starten fuer CPU/GPU-Temperatur!"
          } > release_notes.md
          cat release_notes.md

      - name: Delete existing release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Deleting existing release for tag $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/HA_DeskLink_Setup_*.exe
            HA_DeskLink_Portable_*.zip
          body_path: release_notes.md
          generate_release_notes: false

      - name: Discord Release Notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          curl -s -X POST -H "Content-Type: application/json" "$DISCORD_WEBHOOK" \
            -d "{\"username\":\"HA DeskLink Release\",\"embeds\":[{\"title\":\"🪟 HA DeskLink Windows v${VERSION}\",\"color\":5763719,\"description\":\"Neue Version verfügbar!\",\"fields\":[{\"name\":\"📦 Download\",\"value\":\"[GitHub Release](https://github.com/TechFlipsi/ha-desklink-windows/releases/latest)\"},{\"name\":\"💬 Discord\",\"value\":\"[Join Server](https://discord.gg/HnCZY54U7)\"}]}]}"